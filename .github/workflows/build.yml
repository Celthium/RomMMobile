name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('dev-{0}', github.sha) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # app/build.gradle.kts reads `releaseSigning=<file>` from local.properties.
      # Without the KEYSTORE_* secrets the APK is signed with the debug key.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: the APK will be signed with the DEBUG key."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          PROPS="$RUNNER_TEMP/signing.properties"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            printf 'storeFile=%s\n' "$KEYSTORE"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > "$PROPS"
          printf 'releaseSigning=%s\n' "$PROPS" >> local.properties

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$SRC" ]; then echo "::error::No release APK found"; exit 1; fi
          cp "$SRC" "RomMMobile-${VERSION}.apk"

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: RomMMobile-${{ env.VERSION }}
          path: RomMMobile-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Upload artifact to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: RomMMobile-${{ env.VERSION }}.apk
          fail_on_unmatched_files: true